[workspace]
members = [
    "crates/smi-mef-core",
    "crates/smi-mef-observe",
    "crates/smi-mef-llamacpp",
    "crates/smi-mef-air",
    "crates/smi-mef-plan",
    "crates/smi-mef-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
smi-ir = { git = "https://github.com/Superior-MI-Labs/Superior-MI-Builder", rev = "82a5ed814a42dc9ca4e8c1540227f18d4f97e11e" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
